<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 658" width="780" height="658">
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .wing {
        transform-box: fill-box;
        animation: flutter-l 3.6s ease-in-out infinite;
      }
      .wing-l { transform-origin: 96% 42%; }
      .wing-r {
        transform-origin: 4% 42%;
        animation-name: flutter-r;
      }
      .sprout {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: sway 5s ease-in-out infinite;
      }
      .eyes {
        transform-box: fill-box;
        transform-origin: center;
        animation: blink 5.6s infinite;
      }
    }
    @keyframes flutter-l {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-6deg); }
    }
    @keyframes flutter-r {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(6deg); }
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2.5deg); }
    }
    @keyframes blink {
      0%, 93%, 100% { transform: scaleY(1); }
      95.5%, 97.5% { transform: scaleY(0.1); }
    }
  </style>
  <defs>
    <linearGradient id="body" x1="25%" y1="5%" x2="62%" y2="100%">
      <stop offset="0" stop-color="#6ee47c"/>
      <stop offset=".45" stop-color="#4bd36f"/>
      <stop offset="1" stop-color="#1cbb67"/>
    </linearGradient>
    <linearGradient id="wingL" x1="100%" y1="30%" x2="0%" y2="60%">
      <stop offset="0" stop-color="#48d370"/>
      <stop offset="1" stop-color="#5fca78"/>
    </linearGradient>
    <linearGradient id="wingR" x1="0%" y1="30%" x2="100%" y2="60%">
      <stop offset="0" stop-color="#48d370"/>
      <stop offset="1" stop-color="#5fca78"/>
    </linearGradient>
    <linearGradient id="leaf" x1="20%" y1="100%" x2="70%" y2="0%">
      <stop offset="0" stop-color="#4fd870"/>
      <stop offset="1" stop-color="#7ce987"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- left wing: upper + lower petal -->
  <g class="wing wing-l" fill="url(#wingL)">
    <path d="M 250 375 C 198 315 128 280 72 282 C 92 355 158 432 238 462 C 254 436 258 404 250 375 Z"/>
    <path d="M 238 448 C 186 452 138 476 102 510 C 152 540 212 538 250 508 C 254 484 248 464 238 448 Z"/>
  </g>
  <!-- right wing -->
  <g class="wing wing-r" fill="url(#wingR)">
    <path d="M 530 375 C 582 315 652 280 708 282 C 688 355 622 432 542 462 C 526 436 522 404 530 375 Z"/>
    <path d="M 542 448 C 594 452 642 476 678 510 C 628 540 568 538 530 508 C 526 484 532 464 542 448 Z"/>
  </g>

  <!-- sprout: short stem + two fat leaves hugging the crown -->
  <g class="sprout">
    <path d="M 386 240 C 384 218 386 202 390 186" fill="none" stroke="#2bc96a" stroke-width="16" stroke-linecap="round"/>
    <path d="M 390 190 C 314 196 260 148 288 70 C 366 64 402 122 390 190 Z" fill="url(#leaf)"/>
    <path d="M 394 186 C 470 194 530 140 520 56 C 436 52 388 114 394 186 Z" fill="url(#leaf)"/>
  </g>

  <!-- body: squat rounded dome, gently tucked at the base -->
  <path d="M 305 628
           C 230 626 178 572 176 486
           C 174 345 255 232 395 232
           C 535 232 616 345 614 486
           C 612 572 560 626 485 628
           Z" fill="url(#body)"/>

  <!-- cheeks: soft light bumps low on the face -->
  <g fill="#5cdd7c" opacity=".7" filter="url(#soft)">
    <ellipse cx="228" cy="502" rx="24" ry="36" transform="rotate(-16 228 502)"/>
    <ellipse cx="562" cy="502" rx="24" ry="36" transform="rotate(16 562 502)"/>
  </g>

  <!-- eyes -->
  <g class="eyes" fill="#012816">
    <circle cx="311" cy="363" r="17"/>
    <circle cx="473" cy="363" r="17"/>
  </g>
</svg>
